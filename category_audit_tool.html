<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WS Lawn Care - Category Audit Tool</title>
    <style>
        :root {
            --primary-green: #2d5016;
            --light-green: #4a7c2c;
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
            --border-color: #bdc3c7;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --info: #3498db;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background: #f5f5f5;
            color: var(--text-dark);
            padding: 20px;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 30px;
            border-left: 4px solid var(--primary-green);
        }
        
        h1 {
            color: var(--primary-green);
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: var(--text-light);
            margin-bottom: 20px;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        label {
            font-size: 0.85em;
            color: var(--text-light);
            font-weight: 600;
        }
        
        select, input {
            padding: 10px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 1em;
        }
        
        button {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
        }
        
        .btn-primary {
            background: var(--primary-green);
        }
        
        .btn-primary:hover {
            background: var(--light-green);
        }
        
        .btn-info {
            background: var(--info);
        }
        
        .btn-info:hover {
            background: #2980b9;
        }
        
        .section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .summary-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--primary-green);
        }
        
        .summary-label {
            font-size: 0.85em;
            color: var(--text-light);
            margin-bottom: 5px;
        }
        
        .summary-value {
            font-size: 1.8em;
            font-weight: 700;
            color: var(--text-dark);
        }
        
        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid var(--info);
        }
        
        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border-left: 4px solid var(--warning);
        }
        
        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid var(--danger);
        }
        
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            max-height: 600px;
            overflow-y: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        
        thead {
            background: var(--primary-green);
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 0.5px;
        }
        
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e9ecef;
        }
        
        tbody tr:hover {
            background: #f8f9fa;
        }
        
        .highlight {
            background: #fff3cd !important;
        }
        
        .amount-cell {
            font-weight: 600;
            font-family: 'Courier New', monospace;
        }
        
        .export-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }
        
        .category-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
        }
        
        .category-item {
            padding: 10px;
            border-bottom: 1px solid #e9ecef;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .category-item:hover {
            background: #f8f9fa;
        }
        
        .category-name {
            font-weight: 600;
            color: var(--text-dark);
        }
        
        .category-stats {
            font-size: 0.9em;
            color: var(--text-light);
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔍 Category Audit Tool</h1>
        <p class="subtitle">Row-by-row breakdown to verify category totals match your spreadsheet</p>
        
        <div class="controls">
            <div class="control-group">
                <label>View Period:</label>
                <select id="viewType" onchange="loadData()">
                    <option value="ytd">Year to Date 2025</option>
                    <option value="monthly">Monthly</option>
                    <option value="yearly">Yearly</option>
                    <option value="all">All Time</option>
                </select>
            </div>
            
            <div class="control-group" id="monthGroup" style="display: none;">
                <label>Month:</label>
                <select id="monthSelect" onchange="loadData()">
                    <option value="0">January</option>
                    <option value="1">February</option>
                    <option value="2">March</option>
                    <option value="3">April</option>
                    <option value="4">May</option>
                    <option value="5">June</option>
                    <option value="6">July</option>
                    <option value="7">August</option>
                    <option value="8">September</option>
                    <option value="9">October</option>
                    <option value="10">November</option>
                    <option value="11">December</option>
                </select>
            </div>
            
            <div class="control-group" id="yearGroup">
                <label>Year:</label>
                <select id="yearSelect" onchange="loadData()"></select>
            </div>
            
            <div class="control-group">
                <label>Filter Category:</label>
                <input type="text" id="categoryFilter" placeholder="e.g., Equipment Purchase" style="width: 250px;">
            </div>
            
            <div class="control-group" style="justify-content: flex-end;">
                <label>&nbsp;</label>
                <button class="btn-primary" onclick="filterByCategory()">🔎 Search</button>
            </div>
            
            <div class="control-group" style="justify-content: flex-end;">
                <label>&nbsp;</label>
                <button class="btn-info" onclick="showAllCategories()">📋 Show All Categories</button>
            </div>
        </div>
    </div>

    <div id="summarySection" style="display: none;">
        <div class="section">
            <h2 style="color: var(--primary-green); margin-bottom: 20px;">📊 Category Summary</h2>
            <div id="alertContainer"></div>
            <div class="summary-grid" id="summaryGrid"></div>
        </div>
    </div>

    <div id="categoriesListSection" style="display: none;">
        <div class="section">
            <h2 style="color: var(--primary-green); margin-bottom: 20px;">📋 All Categories</h2>
            <div class="category-list" id="categoriesList"></div>
        </div>
    </div>

    <div id="detailSection" style="display: none;">
        <div class="section">
            <h2 style="color: var(--primary-green); margin-bottom: 20px;">🔍 Transaction Details</h2>
            <div id="detailInfo"></div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Row #</th>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Type</th>
                            <th>Cost Type</th>
                            <th>Amount</th>
                            <th>Parsed Amount</th>
                        </tr>
                    </thead>
                    <tbody id="detailTableBody"></tbody>
                </table>
            </div>
            
            <div class="export-buttons">
                <button class="btn-primary" onclick="exportToCSV()">📥 Export to CSV</button>
                <button class="btn-info" onclick="copyToClipboard()">📋 Copy to Clipboard</button>
            </div>
        </div>
    </div>

    <div id="loadingSection" class="loading">
        <h2>Loading data from Google Sheets...</h2>
        <p>Please wait...</p>
    </div>

    <script>
        const SPREADSHEET_ID = '1fFbsuDFXu_W4MK234vNwM-WsEHkcDp6N1Tn_ZRe_J1I';
        const TRANSACTIONS_GID = '1256593101';

        let allTransactionsData = [];
        let filteredTransactions = [];
        let currentCategoryData = null;

        // Initialize year picker
        function initYearPicker() {
            const yearSelect = document.getElementById('yearSelect');
            for (let year = 2020; year <= 2026; year++) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                if (year === 2025) option.selected = true;
                yearSelect.appendChild(option);
            }
        }

        // Parse CSV properly
        function parseCSV(text) {
            const lines = text.split('\n').filter(line => line.trim());
            if (lines.length === 0) return [];
            
            function parseLine(line) {
                const result = [];
                let current = '';
                let inQuotes = false;
                
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        if (inQuotes && i + 1 < line.length && line[i + 1] === '"') {
                            current += '"';
                            i++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (char === ',' && !inQuotes) {
                        result.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                result.push(current.trim());
                return result;
            }
            
            const headers = parseLine(lines[0]);
            const data = [];
            
            for (let i = 1; i < lines.length; i++) {
                const values = parseLine(lines[i]);
                const row = { _rowNumber: i + 1 }; // Track original row number
                headers.forEach((header, index) => {
                    row[header] = values[index] || '';
                });
                data.push(row);
            }
            
            return data;
        }

        function getValue(row, ...columnNames) {
            for (let name of columnNames) {
                if (row[name] !== undefined) {
                    return row[name];
                }
            }
            return '';
        }

        function parseNumber(value) {
            if (!value) return 0;
            return parseFloat(value.toString().replace(/[$,]/g, '')) || 0;
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(amount);
        }

        function parseDate(dateStr) {
            if (!dateStr) return null;
            const parts = dateStr.split('/');
            if (parts.length !== 3) return null;
            let month = parseInt(parts[0]) - 1;
            let day = parseInt(parts[1]);
            let year = parseInt(parts[2]);
            if (year < 100) year += 2000;
            return new Date(year, month, day);
        }

        async function loadData() {
            try {
                document.getElementById('loadingSection').style.display = 'block';
                document.getElementById('summarySection').style.display = 'none';
                document.getElementById('detailSection').style.display = 'none';
                document.getElementById('categoriesListSection').style.display = 'none';
                
                const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&gid=${TRANSACTIONS_GID}`;
                
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const text = await response.text();
                allTransactionsData = parseCSV(text);
                
                console.log('✅ Loaded', allTransactionsData.length, 'transactions');
                
                filterTransactions();
                document.getElementById('loadingSection').style.display = 'none';
                
            } catch (error) {
                console.error('❌ Load error:', error);
                alert(`Error loading data: ${error.message}`);
            }
        }

        function filterTransactions() {
            const viewType = document.getElementById('viewType').value;
            
            // Show/hide month selector
            document.getElementById('monthGroup').style.display = viewType === 'monthly' ? 'block' : 'none';
            document.getElementById('yearGroup').style.display = viewType === 'all' ? 'none' : 'block';
            
            if (viewType === 'all') {
                filteredTransactions = allTransactionsData;
            } else if (viewType === 'ytd') {
                filteredTransactions = allTransactionsData.filter(row => {
                    const dateStr = getValue(row, 'Date', 'date', 'DATE');
                    const date = parseDate(dateStr);
                    return date && date.getFullYear() === 2025;
                });
            } else if (viewType === 'monthly') {
                const month = parseInt(document.getElementById('monthSelect').value);
                const year = parseInt(document.getElementById('yearSelect').value);
                filteredTransactions = allTransactionsData.filter(row => {
                    const dateStr = getValue(row, 'Date', 'date', 'DATE');
                    const date = parseDate(dateStr);
                    return date && date.getMonth() === month && date.getFullYear() === year;
                });
            } else if (viewType === 'yearly') {
                const year = parseInt(document.getElementById('yearSelect').value);
                filteredTransactions = allTransactionsData.filter(row => {
                    const dateStr = getValue(row, 'Date', 'date', 'DATE');
                    const date = parseDate(dateStr);
                    return date && date.getFullYear() === year;
                });
            }
            
            console.log(`📊 Filtered to ${filteredTransactions.length} transactions`);
        }

        function filterByCategory() {
            const searchTerm = document.getElementById('categoryFilter').value.trim().toLowerCase();
            
            if (!searchTerm) {
                alert('Please enter a category name to search');
                return;
            }
            
            // Find matching transactions
            const matches = filteredTransactions.filter(txn => {
                const category = getValue(txn, 'Category', 'category', 'CATEGORY').toLowerCase();
                return category.includes(searchTerm);
            });
            
            if (matches.length === 0) {
                alert(`No transactions found for category containing: "${searchTerm}"`);
                return;
            }
            
            // Group by exact category name and cost type
            const categoryGroups = {};
            matches.forEach(txn => {
                const category = getValue(txn, 'Category', 'category', 'CATEGORY');
                const costType = getValue(txn, 'Cost Type', 'cost type', 'CostType') || 'Unknown';
                const key = `${category}|||${costType}`; // Use ||| as separator
                
                if (!categoryGroups[key]) {
                    categoryGroups[key] = {
                        category: category,
                        costType: costType,
                        transactions: []
                    };
                }
                categoryGroups[key].transactions.push(txn);
            });
            
            displayCategoryBreakdown(categoryGroups, searchTerm);
        }

        function showAllCategories() {
            // Group all transactions by category
            const categoryGroups = {};
            
            filteredTransactions.forEach(txn => {
                const category = getValue(txn, 'Category', 'category', 'CATEGORY') || 'Uncategorized';
                const costType = getValue(txn, 'Cost Type', 'cost type', 'CostType') || 'Unknown';
                const amount = Math.abs(parseNumber(getValue(txn, 'Amount', 'amount')));
                
                const key = `${category}|||${costType}`;
                
                if (!categoryGroups[key]) {
                    categoryGroups[key] = {
                        category: category,
                        costType: costType,
                        amount: 0,
                        count: 0
                    };
                }
                categoryGroups[key].amount += amount;
                categoryGroups[key].count += 1;
            });
            
            // Sort by amount descending
            const sorted = Object.values(categoryGroups).sort((a, b) => b.amount - a.amount);
            
            let html = '';
            sorted.forEach(group => {
                html += `
                    <div class="category-item" onclick="searchSpecificCategory('${group.category.replace(/'/g, "\\'")}')">
                        <div class="category-name">${group.category} - ${group.costType}</div>
                        <div class="category-stats">
                            ${formatCurrency(group.amount)} • ${group.count} transactions
                        </div>
                    </div>
                `;
            });
            
            document.getElementById('categoriesList').innerHTML = html;
            document.getElementById('categoriesListSection').style.display = 'block';
            document.getElementById('summarySection').style.display = 'none';
            document.getElementById('detailSection').style.display = 'none';
        }

        function searchSpecificCategory(categoryName) {
            document.getElementById('categoryFilter').value = categoryName;
            filterByCategory();
        }

        function displayCategoryBreakdown(categoryGroups, searchTerm) {
            document.getElementById('categoriesListSection').style.display = 'none';
            document.getElementById('summarySection').style.display = 'block';
            document.getElementById('detailSection').style.display = 'block';
            
            const groups = Object.values(categoryGroups);
            
            // Calculate totals
            let grandTotal = 0;
            let grandCount = 0;
            groups.forEach(group => {
                group.transactions.forEach(txn => {
                    grandTotal += Math.abs(parseNumber(getValue(txn, 'Amount', 'amount')));
                    grandCount++;
                });
            });
            
            // Show alert if multiple category variations found
            let alertHtml = '';
            if (groups.length > 1) {
                const uniqueCategories = [...new Set(groups.map(g => g.category))];
                if (uniqueCategories.length > 1) {
                    alertHtml = `
                        <div class="alert alert-warning">
                            <strong>⚠️ Multiple category variations found:</strong><br>
                            ${uniqueCategories.map(c => `"${c}"`).join(', ')}<br>
                            This could indicate inconsistent category naming in your spreadsheet.
                        </div>
                    `;
                }
            }
            
            document.getElementById('alertContainer').innerHTML = alertHtml;
            
            // Display summary cards
            let summaryHtml = `
                <div class="summary-card">
                    <div class="summary-label">Total Amount</div>
                    <div class="summary-value">${formatCurrency(grandTotal)}</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">Transaction Count</div>
                    <div class="summary-value">${grandCount}</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">Category Groups</div>
                    <div class="summary-value">${groups.length}</div>
                </div>
            `;
            
            document.getElementById('summaryGrid').innerHTML = summaryHtml;
            
            // Build detail table
            let detailHtml = `
                <div class="alert alert-info">
                    <strong>📋 Showing ${grandCount} transactions</strong> matching search: "<strong>${searchTerm}</strong>"
                </div>
            `;
            
            groups.forEach(group => {
                const groupTotal = group.transactions.reduce((sum, txn) => {
                    return sum + Math.abs(parseNumber(getValue(txn, 'Amount', 'amount')));
                }, 0);
                
                detailHtml += `
                    <h3 style="color: var(--primary-green); margin: 20px 0 10px 0;">
                        ${group.category} - ${group.costType}: ${formatCurrency(groupTotal)} (${group.transactions.length} transactions)
                    </h3>
                `;
            });
            
            document.getElementById('detailInfo').innerHTML = detailHtml;
            
            // Build transaction table rows
            let tableRows = '';
            groups.forEach(group => {
                group.transactions.forEach(txn => {
                    const dateStr = getValue(txn, 'Date', 'date', 'DATE');
                    const description = getValue(txn, 'Description', 'description', 'DESCRIPTION');
                    const category = getValue(txn, 'Category', 'category', 'CATEGORY');
                    const type = getValue(txn, 'Type', 'type', 'TYPE');
                    const costType = getValue(txn, 'Cost Type', 'cost type', 'CostType');
                    const amountStr = getValue(txn, 'Amount', 'amount');
                    const amountParsed = parseNumber(amountStr);
                    const amountAbs = Math.abs(amountParsed);
                    
                    tableRows += `
                        <tr>
                            <td>${txn._rowNumber}</td>
                            <td>${dateStr}</td>
                            <td>${description}</td>
                            <td>${category}</td>
                            <td>${type}</td>
                            <td>${costType}</td>
                            <td class="amount-cell">${amountStr}</td>
                            <td class="amount-cell">${formatCurrency(amountAbs)}</td>
                        </tr>
                    `;
                });
            });
            
            document.getElementById('detailTableBody').innerHTML = tableRows;
            currentCategoryData = { groups, grandTotal, grandCount, searchTerm };
        }

        function exportToCSV() {
            if (!currentCategoryData) return;
            
            let csv = 'Row #,Date,Description,Category,Type,Cost Type,Original Amount,Parsed Amount\n';
            
            currentCategoryData.groups.forEach(group => {
                group.transactions.forEach(txn => {
                    const row = [
                        txn._rowNumber,
                        getValue(txn, 'Date', 'date', 'DATE'),
                        getValue(txn, 'Description', 'description', 'DESCRIPTION'),
                        getValue(txn, 'Category', 'category', 'CATEGORY'),
                        getValue(txn, 'Type', 'type', 'TYPE'),
                        getValue(txn, 'Cost Type', 'cost type', 'CostType'),
                        getValue(txn, 'Amount', 'amount'),
                        Math.abs(parseNumber(getValue(txn, 'Amount', 'amount')))
                    ];
                    csv += row.map(cell => `"${cell}"`).join(',') + '\n';
                });
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `category_audit_${currentCategoryData.searchTerm.replace(/\s+/g, '_')}.csv`;
            a.click();
        }

        function copyToClipboard() {
            if (!currentCategoryData) return;
            
            let text = `CATEGORY AUDIT: ${currentCategoryData.searchTerm}\n`;
            text += `Total: ${formatCurrency(currentCategoryData.grandTotal)}\n`;
            text += `Count: ${currentCategoryData.grandCount} transactions\n\n`;
            text += 'Row #\tDate\tDescription\tCategory\tType\tCost Type\tOriginal\tParsed\n';
            
            currentCategoryData.groups.forEach(group => {
                group.transactions.forEach(txn => {
                    text += `${txn._rowNumber}\t`;
                    text += `${getValue(txn, 'Date', 'date', 'DATE')}\t`;
                    text += `${getValue(txn, 'Description', 'description', 'DESCRIPTION')}\t`;
                    text += `${getValue(txn, 'Category', 'category', 'CATEGORY')}\t`;
                    text += `${getValue(txn, 'Type', 'type', 'TYPE')}\t`;
                    text += `${getValue(txn, 'Cost Type', 'cost type', 'CostType')}\t`;
                    text += `${getValue(txn, 'Amount', 'amount')}\t`;
                    text += `${Math.abs(parseNumber(getValue(txn, 'Amount', 'amount')))}\n`;
                });
            });
            
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Copied to clipboard!');
            });
        }

        // Initialize
        initYearPicker();
        loadData();
    </script>
</body>
</html>
